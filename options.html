<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Options - Stripe Invoice ZIP</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { margin-top: 20px; background: #635bff; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Options</h1>
  <label>Filename template</label>
  <input id="template" type="text" placeholder="{date}_{number}_{amount}.pdf">
  <p style="font-size:13px;color:#6b7280;">Available: {date} {number} {amount} {customer}</p>
  <button id="save">Save</button>
  <p id="msg" style="color:#16a34a;display:none;">Saved!</p>
  <script src="options.js"></script>
</body>
</html>
