<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 18px; font-family: system-ui, -apple-system, sans-serif; margin: 0; color: #111; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #6b7280; margin: 0 0 16px; }
    .card { background: #f9fafb; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
    button { background: #635bff; color: white; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
    button.secondary { background: transparent; color: #635bff; border: 1px solid #635bff; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Stripe Invoice ZIP</h1>
  <p class="sub">Select invoices on the page and download as ZIP.</p>
  <div class="card" id="status">Loading...</div>
  <button id="upgrade">Upgrade to Pro (unlimited)</button>
  <button class="secondary" id="reset">Reset free counter (dev)</button>
  <script src="popup.js"></script>
</body>
</html>
